  <text x="68" y="203" font-family="Arial,Helvetica,sans-serif" font-size="116" font-weight="700" letter-spacing="8" fill="#f5f4fc">VOID</text>
  <text x="74" y="251" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#d5d1e6">Desarrollo web y experiencias digitales.</text>
  <text x="74" y="305" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2" fill="#9592b0">FULL STACK  /  DISEÑO  /  SOLUCIONES DIGITALES</text>
